# 审稿结果。由 prd-review-refine 写入 inputs/<需求ID>/review-findings.yaml。

id: XXXX-000
spec_version: "1.2"
reviewed_at: ""
mode: default                   # default | no-edit | score-only
reviewed_file_commit: ""        # 被审版本的提交 SHA；未提交时填文件的 sha256

findings:
  - id: F-1
    severity: P1                # P0 | P1 | P2 | P3（CN-41）
    category: C-2               # 审稿清单类别，C-1 至 C-14；清单外写「其他」
    found_by: review            # review | lint | cold-read | evidence | omission
    kind: ""                    # 编造 | 遗漏 | 其他；用于统计 case.yaml 的 review_caught
    location: ""                # 编号或章节，如 BR-3、S-2
    problem: ""                 # 问题是什么
    reason: ""                  # 为什么是问题，引用的规则编号
    action: 提出建议            # 直接修改 | 提出建议
    change: ""                  # 直接修改时写改了什么；提出建议时写对应的 Q-n
    status: open                # open | fixed | escalated | wontfix

# 编造与素材遗漏统计（rubric.md 4.2 审稿拦截数）
summary:
  fabricated: null              # kind 为「编造」的问题数
  omissions: null               # kind 为「遗漏」的问题数

# 门禁与质量维度评级（rubric.md）。默认模式下针对修订前的版本。
rating:
  target: before-revision       # before-revision | after-revision
  gates:
    G-1: null                   # true | false
    G-2: null
    G-3: null
    G-4: null                   # 无效果验收章节时填 n/a
    G-5: null
  dimensions:
    Q1: { rating: "", basis: [] }   # rating：通过 | 小问题 | 大问题；basis：依据的问题编号
    Q2: { rating: "", basis: [] }
    Q3: { rating: "", basis: [] }
    Q4: { rating: "", basis: [] }
    Q5: { rating: "", basis: [] }
    Q6: { rating: "", basis: [] }
  trend_score: null             # 趋势分，仅用于同版本内观察，不作门槛
