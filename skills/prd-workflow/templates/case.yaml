# 案例元数据。复制为 cases/<需求ID>/case.yaml 后填写。

id: XXXX-000
project: ""                     # 项目名称；判断规则能否进入核心层时使用（CN-72）
role: train                     # train（参与规则提炼）| blind（盲测，不参与提炼）
sample_type: ""                 # 样本类型，见 core/cases-guide.md
spec_version: "1.4"             # 所依据的规范版本（core/constitution.md）
domain_packs: []                # 生成时启用的领域包

commits:
  draft_v0: ""                  # 生成阶段初稿的提交 SHA
  reviewed: ""                  # 审稿阶段修订后的提交 SHA
  final: ""                     # 人工定稿的提交 SHA

draft_generated_in_fresh_session: null   # 初稿是否由生成 Skill 在独立会话中生成并原样提交（CN-70）；否则不作为样本

# 生成器指标：初稿 → 定稿（core/rubric.md 4.1）
generator:
  non_decision_edits: null      # 非决策类修改条数
  non_decision_minutes: null    # 非决策类修改用时（分钟）
  fact_check:
    sampled: null               # 抽查条数（默认 10）
    fabricated: null            # 来源不支撑内容的条数
    items: []                   # 抽查的编号，如 [BR-2, D-1, ABC-001.3]
  omissions: null               # 素材遗漏数
  omission_items: []            # 遗漏的素材要点，如 ["SRC-2：审批超时自动退回"]
  todo_by_category: {}          # 初稿待补充按类别计数，如 {素材: 3, 权限: 2}

# 完整工作流指标：生成 → 审稿 → 定稿（core/rubric.md 4.2）
workflow:
  total_minutes: null           # 需求负责人总用时（分钟）
  decision_minutes: null        # 其中决策类用时
  post_review_non_decision_edits: null   # 审稿修订稿 → 定稿的非决策类修改条数
  decision_edits: null          # 决策类修改条数
  review_caught: null           # 审稿发现并修正的编造与遗漏数
  gates_passed: null            # 定稿时硬门禁是否全部通过（true / false）
  dimension_ratings: {}         # 质量维度评级，如 {Q1: 通过, Q2: 小问题}

# 下游可用性（可选，core/rubric.md 4.3）
implementation_trial:
  performed: false
  stop_count: null              # 实现方停止并提问的次数
  untestable_ac: null           # 无法定位验证层级的 AC 数
  spec_gaps: null               # 报告的规格缺口数
  notes: ""

# 回归记录（盲测案例）。由提炼阶段 --regress 追加。
regression: []
